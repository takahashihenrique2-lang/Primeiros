<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="processar.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Formulário de Contato</legend>
            <p>
                <label for="inome">Nome:</label>
                <input type="text" id="inome" name="nome" autocomplete="name" placeholder="Nome completo" required>
            </p>
            <p>
                <label for="iemail">Email:</label>
                <input type="email" id="iemail" name="email" autocomplete="email" placeholder="Seu melhor email" required>
            </p>
            <p>
                <label for="imensagem">Mensagem:</label><br>
                <input type="text" id="imensagem" name="mensagem" autocomplete="message" placeholder="Sua mensagem" required>
            </p>
            <p>
                <label for="itelefone">Telefone:</label>
                <input type="tel" id="itelefone" name="telefone" autocomplete="tel" placeholder="(xx) xxxxx-xxxx" required>
            </p>
        </fieldset>
        <fieldset>
            <legend>Dados adicionais</legend>
            <p>
                <label for="idata">Data de nascimento:</label>
                <input type="date" id="idata" name="data_nascimento" placeholder="DD/MM/AAAA" required>
            </p>
            <p>
                <label for="ihora">Hora de nascimento:</label>
                <input type="time" id="ihora" name="hora_nascimento" placeholder="HH:MM" required>
            </p>
        </fieldset>

        <fieldset>
            <legend>Sexo:</legend>
            <input type="radio" name="sexo" id="imasc" value="masculino" required>
            <label for="imasc">Masculino</label><br>
            <input type="radio" name="sexo" id="ifem" value="feminino" required>
            <label for="ifem">Feminino</label><br>
        </fieldset>

        <fieldset>
            <legend>Escolha suas preferências</legend>
                    <label for="icor">Escolha uma cor:</label>
                    <input type="color" name="cor" id="icor" placeholder="Escolha uma cor"><br>
            
                    <label for="inivel" >Escolha um nível de satisfação:</label>
                 <input type="range" name="nivel" id="inivel" min="1" max="10" value="2" oninput="ival.innerHTML = Number(inivel.value)" ><br>
                 <output id="ival">2</output>
            
                   <label for="iarquivo">Selecione um arquivo:</label>
                <input type="file" name="arquivo" id="iarquivo" placeholder="Selecione um arquivo">
        </fieldset>

        <fieldset>
            <legend>Seus esportes favoritos</legend>
            <label for="iesfut">Futebol:</label>
            <input type="checkbox" name="esfut" id="iesfut" value="Futebol"><br>
            <label for="iesbasquete">Basquete:</label>
            <input type="checkbox" name="esbasquete" id="iesbasquete" value="Basquete"><br>
            <label for="iesvolei">Vôlei:</label>
            <input type="checkbox" name="esvolei" id="iesvolei" value="Vôlei"><br>
        </fieldset>

        <fieldset>
            <legend>Informações adicionais</legend>
            <label for="iest">Estado:</label>
            <select name="est" id="iest">
                <optgroup label="Região Norte">
                    <option value="AC">Acre</option>
                    <option value="AM">Amazonas</option>
                    <option value="AP">Amapá</option>
                    <option value="PA">Pará</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="TO">Tocantins</option>
                </optgroup>
                <optgroup label="Região Nordeste">
                    <option value="AL">Alagoas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="MA">Maranhão</option>
                    <option value="PB">Paraíba</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="SE">Sergipe</option>
                </optgroup>
            </select><br>
            <label for="iprof">Profissão:</label>
            <input list="lstprof" name="profissao" id="iprof" placeholder="Digite sua profissão" required>
            <datalist id="lstprof">
                <option value="Cozinheiro">
                <option value="Pedreiro">
                <option value="Barbeiro">
                <option value="Médico">
                <option value="Arquiteto">
            </datalist><br>
            <label for="icomentario">Comentário:</label><br>
            <textarea name="comentario" id="icomentario" cols="30" rows="10" placeholder="Digite seu comentário"></textarea>
        </fieldset>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
