<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="processar.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Formulário de Contato</legend>
            <p>
                <label for="inome">Nome:</label>
                <input type="text" id="inome" name="nome" autocomplete="name" placeholder="Nome completo" required>
            </p>
            <p>
                <label for="iemail">Email:</label>
                <input type="email" id="iemail" name="email" autocomplete="email" placeholder="Seu melhor email" required>
            </p>
            <p>
                <label for="imensagem">Mensagem:</label><br>
                <input type="text" id="imensagem" name="mensagem" autocomplete="message" placeholder="Sua mensagem" required>
            </p>
            <p>
                <label for="itelefone">Telefone:</label>
                <input type="tel" id="itelefone" name="telefone" autocomplete="tel" placeholder="(xx) xxxxx-xxxx" required>
            </p>
        </fieldset>
        <fieldset>
            <legend>Dados adicionais</legend>
            <p>
                <label for="idata">Data de nascimento:</label>
                <input type="date" id="idata" name="data_nascimento" placeholder="DD/MM/AAAA" required>
            </p>
            <p>
                <label for="ihora">Hora de nascimento:</label>
                <input type="time" id="ihora" name="hora_nascimento" placeholder="HH:MM" required>
            </p>
        </fieldset>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
